<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <title>404 — Página no encontrada | Denilson Capa</title>

    <link rel="icon" type="image/svg+xml" href="/assets/images/finalbosslogo.svg">
    <link rel="alternate icon" type="image/png" href="/assets/images/finalbosslogo.svg">
    <link rel="stylesheet" href="/assets/css/fonts.css">
    <link rel="stylesheet" href="/assets/css/styles.css">

    <style>
        /* ================================================
           404 PAGE — Specific styles
           ================================================ */

        .page-404 {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: var(--space-xl);
        }

        /* ---- Background ---- */
        .bg-404 {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* ---- 404 Watermark ---- */
        .watermark-404 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-display);
            font-size: clamp(10rem, 32vw, 22rem);
            font-weight: 900;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.04);
            text-stroke: 1px rgba(255, 255, 255, 0.04);
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            z-index: 0;
        }

        /* ---- Radar pulse (decorative) ---- */
        .radar-wrap {
            position: absolute;
            bottom: 8%;
            right: 6%;
            width: 180px;
            height: 180px;
            pointer-events: none;
            opacity: 0.12;
        }

        .radar-ring {
            position: absolute;
            inset: 0;
            border: 1px solid var(--color-accent);
            border-radius: 50%;
            animation: radar-pulse 3s ease-out infinite;
        }

        .radar-ring:nth-child(2) { animation-delay: 1s; }
        .radar-ring:nth-child(3) { animation-delay: 2s; }

        @keyframes radar-pulse {
            0%   { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(1);   opacity: 0; }
        }

        /* ---- Content ---- */
        .content-404 {
            position: relative;
            z-index: 1;
            max-width: 620px;
            width: 100%;
        }

        /* ---- Error badge ---- */
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-xs) var(--space-md);
            background: rgba(225, 71, 0, 0.06);
            border: 1px solid rgba(225, 71, 0, 0.25);
            border-radius: var(--radius-full);
            font-family: var(--font-body);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            color: var(--color-primary);
            margin-bottom: var(--space-2xl);
            text-transform: uppercase;
        }

        .badge-blink {
            width: 6px;
            height: 6px;
            background: var(--color-primary);
            border-radius: 50%;
            animation: blink 1.4s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.1; }
        }

        /* ---- Heading ---- */
        .heading-404 {
            font-family: var(--font-display);
            font-size: clamp(2.8rem, 9vw, 5.5rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin-bottom: var(--space-xl);
        }

        /* ---- Subtitle ---- */
        .subtitle-404 {
            font-size: clamp(1rem, 2vw, 1.1rem);
            color: var(--color-text-secondary);
            line-height: 1.75;
            margin-bottom: var(--space-xl);
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ---- Coordinates ---- */
        .coords-404 {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--space-md);
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            color: var(--color-text-muted);
            margin-bottom: var(--space-3xl);
        }

        .coords-sep {
            width: 1px;
            height: 10px;
            background: var(--color-border);
        }

        .coords-status {
            color: var(--color-accent);
            animation: blink 2.5s ease-in-out infinite;
        }

        /* ---- CTA area ---- */
        .cta-404 {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: var(--space-md);
        }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            font-size: 0.875rem;
            color: var(--color-text-muted);
            text-decoration: none;
            transition: color var(--transition-base);
            padding: var(--space-md) var(--space-xl);
        }

        .btn-ghost:hover {
            color: var(--color-text-secondary);
        }

        /* ---- Responsive ---- */
        @media (max-width: 480px) {
            .coords-sep { display: none; }
            .coords-404 { gap: var(--space-sm); }
            .radar-wrap  { display: none; }
        }
    </style>
</head>
<body>
    <main class="page-404" id="main-content">

        <!-- Background: quiet dot-field grid (same as hero) -->
        <div class="bg-404" aria-hidden="true">
            <div class="grid-overlay"></div>
        </div>

        <!-- Watermark -->
        <div class="watermark-404" aria-hidden="true">404</div>

        <!-- Radar pulse -->
        <div class="radar-wrap" aria-hidden="true">
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
        </div>

        <!-- Content -->
        <div class="content-404">

            <div class="error-badge">
                <span class="badge-blink"></span>
                Error 404 &mdash; Página no encontrada
            </div>

            <h1 class="heading-404">
                Are you <span class="gradient-text">lost?</span>
            </h1>

            <p class="subtitle-404">
                The page you're looking for doesn't exist<br>
                or has been moved somewhere else.
            </p>

            <div class="coords-404">
                <span>41°22′24″N</span>
                <div class="coords-sep"></div>
                <span>2°07′18″E</span>
                <div class="coords-sep"></div>
                <span class="coords-status">SIGNAL: LOST</span>
            </div>

            <div class="cta-404">
                <a href="/" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M19 12H5M12 5l-7 7 7 7"/>
                    </svg>
                    <span>Volver al inicio</span>
                </a>

                <a href="/contacto.html" class="btn-ghost">
                    Contactar
                </a>
            </div>

        </div>
    </main>
</body>
</html>
